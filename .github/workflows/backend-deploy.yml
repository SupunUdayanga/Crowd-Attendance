
name: Backend Azure Staging Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-stage:
    name: Validate and Stage Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web_app/admin-portal/server/package-lock.json

      - name: Install and Validate Backend
        working-directory: web_app/admin-portal/server
        run: |
          npm ci
          node --check index.js
          node --check app.js
          node --check firebaseAdmin.js
          npm audit --omit=dev --audit-level=high

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AZURE_VM_SSH_KEY }}
          AZURE_VM_HOST: ${{ vars.AZURE_VM_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s %s\n' "$AZURE_VM_HOST" \
            'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILu6Wi9+JXH+fuGS1bbk7KDKXSNSPMp3cheM0aBdhdwb' \
            > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

          ssh-keygen -lf ~/.ssh/known_hosts -E sha256 \
            | grep -F 'SHA256:aEf0dLcrStHBlSNz9tMHgPWy++nT27mp0U0p46M3XJU'

      - name: Upload Backend to Azure Staging
        env:
          AZURE_VM_HOST: ${{ vars.AZURE_VM_HOST }}
          AZURE_VM_USER: ${{ vars.AZURE_VM_USER }}
        run: |
          tar -czf /tmp/crowd-backend.tar.gz \
            -C web_app/admin-portal/server \
            --exclude=node_modules \
            --exclude=.env \
            .

          scp -o BatchMode=yes \
            /tmp/crowd-backend.tar.gz \
            "$AZURE_VM_USER@$AZURE_VM_HOST:/tmp/crowd-backend.tar.gz"

      - name: Validate Azure Staging Deployment
        env:
          AZURE_VM_HOST: ${{ vars.AZURE_VM_HOST }}
          AZURE_VM_USER: ${{ vars.AZURE_VM_USER }}
        run: |
          ssh -o BatchMode=yes \
            "$AZURE_VM_USER@$AZURE_VM_HOST" \
            'set -eu
             STAGE="$HOME/backend-cd-staging"
             mkdir -p "$STAGE"
             tar -xzf /tmp/crowd-backend.tar.gz -C "$STAGE"
             cd "$STAGE"
             npm ci
             node --check index.js
             node --check app.js
             node --check firebaseAdmin.js
             npm audit --omit=dev --audit-level=high
             echo "Azure staging deployment validation passed"'
