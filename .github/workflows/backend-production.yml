
name: Backend Azure Production Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Production Backend
    if: github.ref == 'refs/heads/MAIN'
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: web_app/admin-portal/server

    steps:
      - name: Checkout MAIN
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web_app/admin-portal/server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check backend syntax
        run: |
          node --check index.js
          node --check app.js
          node --check firebaseAdmin.js

      - name: Backend security audit
        run: npm audit --omit=dev --audit-level=high

  rollback-test:
    name: Test Release Rollback
    needs: validate
    runs-on: ubuntu-24.04

    steps:
      - name: Simulate deployment and rollback
        shell: bash
        run: |
          set -euo pipefail

          BASE="$(mktemp -d)"
          trap 'rm -rf "$BASE"' EXIT

          mkdir -p "$BASE/releases/v1" "$BASE/releases/v2"

          echo "v1" > "$BASE/releases/v1/version.txt"
          echo "v2" > "$BASE/releases/v2/version.txt"

          cd "$BASE"

          # Set initial release
          ln -s releases/v1 current

          PREVIOUS="$(readlink current)"

          test "$(cat current/version.txt)" = "v1"

          echo "Initial release: v1"

          # Simulate deploying v2
          ln -s releases/v2 current.next
          mv -Tf current.next current

          test "$(cat current/version.txt)" = "v2"

          echo "New release deployed: v2"

          # Simulate rollback
          ln -s "$PREVIOUS" current.next
          mv -Tf current.next current

          test "$(cat current/version.txt)" = "v1"

          echo "Rollback restored: v1"
          echo "Release switching and rollback simulation passed."

  production-gate:
    name: Production Approval Gate
    needs: [validate, rollback-test]
    if: github.ref == 'refs/heads/MAIN'
    runs-on: ubuntu-24.04
    environment: backend-production

    steps:
      - name: Confirm dry-run only
        run: |
          echo "Backend production validation completed."
          echo "Rollback simulation passed."
          echo "Production approval gate completed."
          echo "DRY RUN ONLY."
          echo "No files transferred to Azure."
          echo "No PM2 restart."
          echo "No live deployment."
          echo "Production release remains disabled."
