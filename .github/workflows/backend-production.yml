
name: Backend Azure Production Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Production Backend
    if: github.ref == 'refs/heads/MAIN'
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: web_app/admin-portal/server

    steps:
      - name: Checkout approved commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web_app/admin-portal/server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check backend syntax
        run: |
          node --check index.js
          node --check app.js
          node --check firebaseAdmin.js

      - name: Verify health endpoint exists
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const app = fs.readFileSync('app.js', 'utf8');

          if (!app.includes("app.get('/health'")) {
            throw new Error('Production health endpoint missing');
          }

          console.log('Health endpoint source: PASS');
          NODE

      - name: Backend security audit
        run: npm audit --omit=dev --audit-level=high

  rollback-test:
    name: Test Release Rollback
    needs: validate
    runs-on: ubuntu-24.04

    steps:
      - name: Simulate deployment and rollback
        shell: bash
        run: |
          set -euo pipefail

          BASE="$(mktemp -d)"
          trap 'rm -rf "$BASE"' EXIT

          mkdir -p "$BASE/releases/v1" "$BASE/releases/v2"

          echo "v1" > "$BASE/releases/v1/version.txt"
          echo "v2" > "$BASE/releases/v2/version.txt"

          cd "$BASE"

          ln -s releases/v1 current
          PREVIOUS="$(readlink current)"

          test "$(cat current/version.txt)" = "v1"

          ln -s releases/v2 current.next
          mv -Tf current.next current

          test "$(cat current/version.txt)" = "v2"

          ln -s "$PREVIOUS" current.next
          mv -Tf current.next current

          test "$(cat current/version.txt)" = "v1"

          echo "Rollback simulation: PASS"

  production-gate:
    name: Production Approval Gate
    needs: [validate, rollback-test]
    if: github.ref == 'refs/heads/MAIN'
    runs-on: ubuntu-24.04
    environment: backend-production

    steps:
      - name: Confirm approval
        run: |
          echo "Production approval gate: PASS"
          echo "Running Azure production readiness checks."
          echo "Live deployment remains disabled."

  azure-readiness:
    name: Azure Production Release Readiness
    needs: production-gate
    if: github.ref == 'refs/heads/MAIN'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout approved commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure verified SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AZURE_VM_SSH_KEY }}
          AZURE_VM_HOST: ${{ vars.AZURE_VM_HOST }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$SSH_PRIVATE_KEY"
          test -n "$AZURE_VM_HOST"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_azure
          chmod 600 ~/.ssh/id_azure

          printf '%s %s\n' "$AZURE_VM_HOST" \
            'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILu6Wi9+JXH+fuGS1bbk7KDKXSNSPMp3cheM0aBdhdwb' \
            > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

          ssh-keygen -lf ~/.ssh/known_hosts -E sha256 \
            | grep -F 'SHA256:aEf0dLcrStHBlSNz9tMHgPWy++nT27mp0U0p46M3XJU'

      - name: Verify approved release and production readiness
        env:
          AZURE_VM_HOST: ${{ vars.AZURE_VM_HOST }}
          AZURE_VM_USER: ${{ vars.AZURE_VM_USER }}
        shell: bash
        run: |
          set -euo pipefail

          SERVER="web_app/admin-portal/server"

          SOURCE_DIGEST="$(
            cd "$SERVER"
            sha256sum \
              app.js \
              index.js \
              firebaseAdmin.js \
              qaConfig.js \
              package-lock.json \
              | sha256sum | awk '{print $1}'
          )"

          ssh -i ~/.ssh/id_azure \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$AZURE_VM_USER@$AZURE_VM_HOST" \
            bash -se -- "$SOURCE_DIGEST" <<'REMOTE'
          set -euo pipefail

          EXPECTED_DIGEST="$1"
          CANDIDATE="$HOME/backend-releases/candidate-03"

          echo "=== Verify approved source ==="

          cd "$CANDIDATE"

          ACTUAL_DIGEST="$(
            sha256sum \
              app.js \
              index.js \
              firebaseAdmin.js \
              qaConfig.js \
              package-lock.json \
              | sha256sum | awk '{print $1}'
          )"

          if [[ "$ACTUAL_DIGEST" != "$EXPECTED_DIGEST" ]]; then
            echo "BLOCKED: Azure candidate differs from GitHub commit"
            exit 1
          fi

          echo "Candidate source verification: PASS"

          echo "=== Verify PM2 Green production ==="

          pm2 jlist | node -e '
          let input = "";

          process.stdin.on("data", chunk => input += chunk);

          process.stdin.on("end", () => {
            const apps = JSON.parse(input);

            const blue = apps.find(
              app => app.name === "crowd-attendance-api"
            );

            const green = apps.find(
              app => app.name === "crowd-attendance-green-production"
            );

            if (!blue || blue.pm2_env.status !== "online") {
              console.error("BLOCKED: Blue backend unavailable");
              process.exit(1);
            }

            if (!green || green.pm2_env.status !== "online") {
              console.error("BLOCKED: Green backend unavailable");
              process.exit(1);
            }

            const env = green.pm2_env;

            if (
              String(env.PORT) !== "5003" ||
              env.pm_cwd !==
                "/home/azureuser/backend-releases/candidate-03"
            ) {
              console.error("BLOCKED: Wrong Green release");
              process.exit(1);
            }

            const forbidden = [
              "FIRESTORE_EMULATOR_HOST",
              "FIREBASE_AUTH_EMULATOR_HOST",
              "GCLOUD_EMULATOR_HOST"
            ];

            if (
              env.QA_MODE === "true" ||
              forbidden.some(key => Boolean(env[key]))
            ) {
              console.error("BLOCKED: QA emulator detected");
              process.exit(1);
            }

            console.log("Blue rollback backend: ONLINE");
            console.log("Green production backend: ONLINE");
            console.log("Production isolation: PASS");
          });
          '

          echo "=== Green health ==="

          curl -fsS --max-time 10 \
            http://127.0.0.1:5003/health \
            | node -e '
          let input = "";

          process.stdin.on("data", chunk => input += chunk);

          process.stdin.on("end", () => {
            const health = JSON.parse(input);

            if (
              health.status !== "ok" ||
              health.service !== "crowd-attendance-backend"
            ) {
              process.exit(1);
            }

            console.log("Green backend health: PASS");
          });
          '

          echo "=== Nginx production ==="

          sudo -n nginx -t

          SITE="/etc/nginx/sites-enabled/crowd-attendance"

          test "$(
            sudo -n grep -Fc \
              'proxy_pass http://127.0.0.1:5003;' "$SITE"
          )" -eq 1

          echo "Active production port 5003: PASS"

          echo "=== Public HTTPS health ==="

          curl -fsS --max-time 15 \
            https://13-70-25-64.sslip.io/health \
            | grep -Fq '"status":"ok"'

          echo "Public production health: PASS"

          echo "AZURE PRODUCTION READINESS: PASS"
          REMOTE

      - name: Validate Reusable Azure Deployment Controller
        env:
          AZURE_VM_HOST: ${{ vars.AZURE_VM_HOST }}
          AZURE_VM_USER: ${{ vars.AZURE_VM_USER }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/id_azure \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$AZURE_VM_USER@$AZURE_VM_HOST" \
            bash -se -- "$RELEASE_SHA" <<'REMOTE'
          set -euo pipefail

          SHA="$1"
          TOOLS="$HOME/backend-release-tools"

          echo "=== Deployment controller dry run ==="

          test -x "$TOOLS/deploy-release.sh"

          "$TOOLS/deploy-release.sh" "$SHA" --dry-run

          echo "Reusable deployment controller: PASS"
          echo "No production switch performed."
          REMOTE

      - name: Confirm deployment remains disabled
        run: |
          echo "================================"
          echo "AZURE PRODUCTION READINESS: PASSED"
          echo "Approved source validated."
          echo "Green production verified."
          echo "Reusable deployment controller: DRY RUN."
          echo "No Nginx traffic switch performed."
          echo "No PM2 processes restarted."
          echo "Automatic live deployment is disabled."
          echo "================================"
